# ============================================================================ #
#  nginx reverse proxy with HTTP Basic Auth for ComfyUI + FileBrowser          #
#  - 8188 -> authenticated proxy to ComfyUI (127.0.0.1:8189)                   #
#  - 8080 -> authenticated proxy to FileBrowser (127.0.0.1:8081)               #
#  htpasswd file generated at startup from WEB_USERNAME / WEB_PASSWORD          #
# ============================================================================ #

worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    # WebSocket upgrade map (needed for ComfyUI live preview / API)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 0;  # no upload limit for large model files

    # ---- ComfyUI proxy ----
    server {
        listen 8188;
        server_name _;

        auth_basic           "ComfyUI";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location / {
            proxy_pass http://127.0.0.1:8189;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }

    # ---- FileBrowser proxy ----
    server {
        listen 8080;
        server_name _;

        auth_basic           "FileBrowser";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location / {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}